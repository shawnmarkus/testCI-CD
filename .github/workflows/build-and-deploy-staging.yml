name: Build and Deploy Staging

on:
  pull_request:
    types: ["closed"]
    branches:
      - staging

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-staging:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Environment
        run: echo "hello world with env name as staging"

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.event.pull_request.head.ref }}" \
            --title "Merge ${{ github.event.pull_request.head.ref }} to main" \
            --body "Automated PR: Merging '${{ github.event.pull_request.head.ref }}' into 'main' after it was merged to 'staging'."
